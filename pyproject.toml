[project]
name = "lmstudio-prompt-enhancer"
version = "2.0.0"
description = "A ComfyUI custom node that enhances image and video generation prompts using LM Studio's local OpenAI-compatible API."
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "openai>=1.0.0",
    "numpy",
    "Pillow"
]

classifiers = [
    "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/AllenCraigBarnard/comfyui-lmstudio-prompt-enhancer"
Documentation = "https://github.com/AllenCraigBarnard/comfyui-lmstudio-prompt-enhancer#readme"
"Bug Tracker" = "https://github.com/AllenCraigBarnard/comfyui-lmstudio-prompt-enhancer/issues"

[tool.comfy]
PublisherId = "puppet-vision"
DisplayName = "LM Studio Prompt Enhancer"
Icon = "https://raw.githubusercontent.com/AllenCraigBarnard/comfyui-lmstudio-prompt-enhancer/refs/heads/main/assets/lmStudio-prompt-enhancer.png"